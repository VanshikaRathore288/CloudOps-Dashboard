name: CI — Lint & Build

# ─────────────────────────────────────────────────────────────────────────────
# This workflow runs on every push and pull request to ensure the codebase
# lints cleanly and builds without errors.
#
# Automatic deployment to AWS EC2 is NOT included here because it requires:
#   1. A self-hosted GitHub Actions runner configured on the EC2 instance, OR
#   2. SSH deploy keys / AWS credentials stored as repository secrets.
#
# When those prerequisites are available, a separate "cd.yml" workflow can be
# added following the deployment guide in the README.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js setup with npm cache ─────────────────────────────────────
      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci --frozen-lockfile

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Run ESLint
        run: npm run lint

      # ── Production build ──────────────────────────────────────────────────
      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Add any public env vars required at build time here, e.g.:
          # NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
